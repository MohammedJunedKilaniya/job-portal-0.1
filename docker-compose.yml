services:
  frontend:
    image: jobportal-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

  backend:
     image: jobportal-backend
     ports: 
      - "5000:5000"
     environment:
       MONGO_URI: mongodb://database:27017/jobportal
     depends_on:
      - database
      
  database:
      image: mongo:latest
      ports:
       - "27017:27017"
      
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
     - "8080:8080"
    volumes:
     - /:/rootfs:ro
     - /sys:/sys:ro
     - /var/run:/var/run:ro
     - /var/lib/docker:/var/lib/docker:ro

  node_exporter:
    image: prom/node-exporter:latest
    container_name: VM-metrices
    ports:
      - "9100:9100"
    volumes:
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    restart: unless-stopped   


  prometheus: 
    image: prom/prometheus:latest
    container_name: prometheus 
    ports:
     - "9090:9090"
    volumes:
     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
     - "3000:3000"
    volumes:
     - grafana_data:/var/lib/grafana
    restart: unless-stopped
  
volumes:
  grafana_data:



