services:
  frontend:
    image: jobportal-frontend
    ports:
      - "8081:80"

  backend:
     image: jobportal-backend
     ports: 
      - "5000:5000"
     environment:
       MONGO_URI: mongodb://database:27017/jobportal
     depends_on:
      - database
      
  database:
      image: mongo:latest
      ports:
       - "27017:27017"
      
 
